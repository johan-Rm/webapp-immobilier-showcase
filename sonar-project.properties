sonar.projectName=showcase-immobilier-webapp
sonar.sourceEncoding=UTF-8

sonar.sources=webapp/app,webapp/server,webapp/services,webapp/shared,webapp/schemas,webapp/scripts,docs
sonar.tests=webapp/scripts
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

sonar.exclusions=\
  webapp/.nuxt/**,\
  webapp/.output/**,\
  webapp/.tmp/**,\
  webapp/coverage/**,\
  webapp/dist/**,\
  webapp/node_modules/**,\
  webapp/schemas/interfaces/**,\
  dev-book/specs[deprecated]/**

sonar.javascript.lcov.reportPaths=webapp/coverage/lcov.info
