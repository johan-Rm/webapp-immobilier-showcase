rules:
  - name: app-script-setup-standard
    requiresManualReview: false
    severity: error
    description: 'Les fichiers Vue app doivent suivre les sections script setup dans l ordre attendu.'
    sectionCount: 12
    sectionPattern: "^\\s*\\/\\/\\s*(\\d+)\\.\\s"

  - name: app-no-commented-code
    requiresManualReview: true
    severity: warning
    description: 'Detecte les lignes de code commentees dans toute la base de code.'
    patterns:
      - '// const '
      - '// function '
      - '// return '
      - '// if ('
      - '// for ('
      - '// while ('
      - '// let '
      - '// var '
      - '// type '
      - '// interface '

  - name: app-no-nested-ternary
    requiresManualReview: false
    severity: error
    description: 'Detecte les ternaires imbriques dans toute la base de code.'

  - name: app-deep-nesting
    requiresManualReview: true
    severity: warning
    description: "Detecte plus de 3 niveaux d'imbrication dans toute la base de code."
    maxNestingDepth: 4
    indentSize: 2
    controlFlowKeywords:
      - 'if ('
      - 'for ('
      - 'while ('
      - 'switch ('
      - 'else {'
      - '} else'

  - name: app-todo-fixme
    requiresManualReview: true
    severity: warning
    description: 'Detecte les commentaires TODO, FIXME, HACK, XXX dans toute la base de code.'
    markers:
      - TODO
      - FIXME
      - HACK
      - XXX

  - name: app-large-component
    requiresManualReview: true
    severity: warning
    description: 'Detecte les composants Vue app/components/ depassant le seuil de lignes.'
    maxLines: 200

  - name: app-large-type
    requiresManualReview: true
    severity: warning
    description: 'Detecte les interfaces et types avec plus de 8 champs dans toute la base de code.'
    maxFields: 8

  - name: app-composable-many-returns
    requiresManualReview: true
    severity: warning
    description: 'Detecte les composables qui exposent plus de 8 valeurs dans leur return.'
    maxReturns: 8

  - name: app-no-redundant-guards
    requiresManualReview: true
    severity: warning
    description: 'Detecte les gardes defensives residuelles sur des variables dont le contrat de type est suffisant.'
    patterns:
      - '?? undefined'
      - '?? null'
    templateDoubleCheckRegex: '\b(\w+)\s+&&\s+\1\.'
