services:
  webapp-localhost:
    build:
      context: ./webapp
      dockerfile: ../infra/docker/Dockerfile.dev
    user: '${DOCKER_UID:-1000}:${DOCKER_GID:-1000}'
    working_dir: /app
    init: true
    command: bun run dev -- --host 0.0.0.0 --port 3000
    volumes:
      - ./webapp/base:/app/base:ro
      - ./webapp/sites:/app/sites
      - ./webapp/app:/app/app
      - ./webapp/server:/app/server
      - ./webapp/shared:/app/shared
      - ./webapp/services:/app/services
      - ./webapp/nuxt.config.ts:/app/nuxt.config.ts
      - ./webapp/tsconfig.json:/app/tsconfig.json:ro
      - ./webapp/vitest.config.ts:/app/vitest.config.ts:ro
      - ./webapp/tailwind.config.ts:/app/tailwind.config.ts:ro
      - ./webapp/package.json:/app/package.json:ro
      - ./webapp/eslint.config.ts:/app/eslint.config.ts:ro
      - ./webapp/prettier.config.cjs:/app/prettier.config.cjs:ro
      - ./codebase-integrity:/codebase-integrity:ro
      - ./webapp/schemas:/app/schemas
      - ./webapp/sites/${GD_TARGET:-showcase-immobilier}/content:/app/content
      - ./webapp/.data:/app/.data
      - ./webapp/sites/${GD_TARGET:-showcase-immobilier}/public:/app/public
      - ./webapp/scripts:/app/scripts
      # Setup reads the existing host config; it must not create a container-only .env.
      - ./webapp/.env:/app/.env:ro
      - ./webapp/fixtures:/app/fixtures:ro
      - ${SCHEMAS_PATH:-./webapp/schemas/source}:/opt/app-schemas:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${WEBAPP_DEV_PORT:-3000}:3000'
    env_file:
      - ./webapp/.env
    environment:
      GD_TARGET: ${GD_TARGET:-showcase-immobilier}
      NODE_ENV: development
      AIDE_WEBAPP_ROOT: /app
      NODE_PATH: /app/node_modules
      SCHEMAS_PATH: /opt/app-schemas
      CONTENT_PATH: /app/content
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/fr || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  playwright:
    profiles:
      - e2e
    build:
      context: ./webapp
      dockerfile: ../infra/docker/Dockerfile.playwright
    user: '${DOCKER_UID:-1000}:${DOCKER_GID:-1000}'
    working_dir: /app
    init: true
    depends_on:
      webapp-localhost:
        condition: service_healthy
    env_file:
      - ./webapp/.env
    environment:
      CI: 'true'
      HOME: /tmp
      PLAYWRIGHT_BASE_URL: http://webapp-localhost:3000
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./webapp/.tmp/playwright:/app/.tmp/playwright
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: bun run test:e2e

  webapp-ssr:
    build:
      context: ./webapp
      dockerfile: ../infra/docker/Dockerfile
      additional_contexts:
        schemas: ${SCHEMAS_PATH:-./webapp/schemas/source}
      args:
        GD_TARGET: ${GD_TARGET:-showcase-immobilier}
        APP_ENV: ${APP_ENV:-dev}
        SITE_URL: ${SITE_URL:-http://webapp.localhost:8080}
        SITE_NAME: ${SITE_NAME:-Mon Webapp}
        WEB_VITALS_ENABLED: ${WEB_VITALS_ENABLED:-false}
        NODE_BUILD_MEMORY_MB: ${NODE_BUILD_MEMORY_MB:-8192}
    working_dir: /app
    init: true
    env_file:
      - ./webapp/.env
    environment:
      GD_TARGET: ${GD_TARGET:-showcase-immobilier}
      NODE_ENV: production
      SCHEMAS_PATH: /opt/app-schemas
      CONTENT_PATH: /app/content
      PUBLIC_HOST: ${PUBLIC_HOST:-webapp.localhost}
      PUBLIC_PORT: ${PUBLIC_PORT:-8080}
      WEB_VITALS_ENABLED: ${WEB_VITALS_ENABLED:-false}
      SYMFONY_API_URL: ${SYMFONY_API_URL:-http://host.docker.internal:18080}
      NUXT_SYMFONY_API_URL: ${SYMFONY_API_URL:-http://host.docker.internal:18080}
      NUXT_SYMFONY_API_DOCS_URL: ${SYMFONY_API_DOCS_URL:-http://host.docker.internal:18080/api/docs}
      NUXT_SYMFONY_PROJECT_ID: ${SYMFONY_PROJECT_ID:-}
      NUXT_SYMFONY_SERVICE_EMAIL: ${SYMFONY_SERVICE_EMAIL:-}
      NUXT_SYMFONY_SERVICE_PASSWORD: ${SYMFONY_SERVICE_PASSWORD:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./webapp/.data:/app/.data
      - ./webapp/sites/${GD_TARGET:-showcase-immobilier}/content:/app/content
      - ${SCHEMAS_PATH:-./webapp/schemas/source}:/opt/app-schemas:ro
      - ./webapp/sites/${GD_TARGET:-showcase-immobilier}/public/images:/app/.output/public/images
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:3000/ || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      webapp-ssr:
        condition: service_healthy
    ports:
      - '${PUBLIC_PORT:-8080}:80'
    volumes:
      - ./infra/nginx/vhost.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
