x-test-common: &test-common
  image: "${COMPOSE_PROJECT_NAME}-verify"
  init: true
  network_mode: host
  working_dir: /workspace/webapp
  environment:
    CI: "true"
    CHECKS_CONTAINER: "1"
    TMPDIR: /workspace/webapp/.tmp/quality/console-tmp
    LOAD_PROFILE: ${LOAD_PROFILE:-smoke}
    NUXT_TELEMETRY_DISABLED: "1"
    AIDE_GIT_ROOT: ${CHECKS_REPO_ROOT:?Racine absolue du worktree requise}
    VERIFY_GIT_ROOT: ${CHECKS_REPO_ROOT:?Racine absolue du worktree requise}
    WEBAPP_BASE_URL: ${WEBAPP_BASE_URL:-}
    WEB005_E2E_FIXTURES: "1"
    SAAS_PROJECTION_ROOT: .tmp/web005-ci
    SAAS_PREVIEW_SECRET: fixture-only-secret-32-characters-minimum
  volumes:
    - type: bind
      source: ${CHECKS_REPO_ROOT:?Racine absolue du worktree requise}
      target: ${CHECKS_REPO_ROOT:?Racine absolue du worktree requise}
      read_only: true
    - type: bind
      source: ${CHECKS_GIT_COMMON_DIR:?Dossier Git commun absolu requis}
      target: ${CHECKS_GIT_COMMON_DIR:?Dossier Git commun absolu requis}
      read_only: true
    - type: bind
      source: ${CHECKS_REPO_ROOT:?Racine absolue du worktree requise}/webapp/.tmp
      target: /workspace/webapp/.tmp

services:
  verify:
    <<: *test-common
    profiles: [quality]
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.playwright
      args:
        CHECKS_UID: ${DOCKER_UID:-1000}
        CHECKS_GID: ${DOCKER_GID:-1000}
    entrypoint: [bun, --no-env-file, run, verify, --]
    command: [unit, --target, showcase-immobilier]
    tmpfs:
      - /workspace/webapp/.nuxt
      - /workspace/webapp/.output
      - /workspace/webapp/dashboard/.nuxt

  app-test:
    <<: *test-common
    profiles: [quality]
    entrypoint: [sh, -ec]
    command:
      - |
        {
          node node_modules/nuxt/bin/nuxt.mjs prepare --dotenv .env.test &&
          node node_modules/nuxt/bin/nuxt.mjs build --dotenv .env.test
        } > .tmp/quality/browser-fixture-build-"$$GD_TARGET".log 2>&1 || {
          tail -40 .tmp/quality/browser-fixture-build-"$$GD_TARGET".log
          exit 1
        }
        exec bun --no-env-file scripts/quality/fixture-server.ts --ssr
    # Nitro doit recréer .output dans la couche jetable du conteneur.
    tmpfs:
      - /workspace/webapp/.nuxt
      - /workspace/webapp/dashboard/.nuxt

  load:
    profiles: [quality]
    image: grafana/k6:1.6.1@sha256:a5ad6bc089a08d77c3ec49f3db8c6fa7a148e4073efcac44c675dbaf3568d8e1
    network_mode: host
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      WEBAPP_BASE_URL: ${WEBAPP_BASE_URL:-}
      LOAD_ROUTE: ${LOAD_ROUTE:-}
      LOAD_PROFILE: ${LOAD_PROFILE:-smoke}
    volumes:
      - ./webapp/scripts/quality/load:/scripts:ro
    command: [run, /scripts/scenarios.js]

  lighthouse:
    profiles: [quality]
    image: dem011-lighthouse:13.0.1
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.lighthouse
    network_mode: host
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    command: [--version]
