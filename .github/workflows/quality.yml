name: third-party-tests
on:
  pull_request:
  push:
    branches: [develop, master]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [showcase-immobilier, client2-immobilier, dashboard]
    env:
      GD_TARGET: ${{ matrix.target }}
      CI: "true"
      NUXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun install --frozen-lockfile --ignore-scripts --cwd ../codebase-integrity
      - run: node node_modules/nuxt/bin/nuxt.mjs prepare --dotenv .env.test
      - run: bun run lint:check
      - run: bun run format:check
      - run: bun run type-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: third-party-${{ matrix.target }}
          path: |
            webapp/.tmp/quality/
            webapp/.tmp/playwright/
          if-no-files-found: warn
  supply-chain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun install --frozen-lockfile --ignore-scripts --cwd ../codebase-integrity
      - run: bun --no-env-file run verify -- architecture
      - run: bun --no-env-file run verify -- security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain
          path: webapp/.tmp/quality/
          if-no-files-found: warn
