name: quality-extended
on:
  workflow_dispatch:
    inputs:
      target:
        description: Cible de test isolée
        type: choice
        options: [showcase-immobilier, client2-immobilier, dashboard]
        default: dashboard
      family:
        description: Mesure à exécuter
        type: choice
        options: [mutation, load, lighthouse]
        default: lighthouse
      profile:
        description: Profil Lighthouse
        type: choice
        options: [desktop, mobile]
        default: desktop
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: webapp
    env:
      GD_TARGET: ${{ inputs.target }}
      QUALITY_BASE_URL: http://127.0.0.1:3000
      NUXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - if: inputs.family != 'mutation'
        run: node node_modules/nuxt/bin/nuxt.mjs build --dotenv .env.test
      - if: inputs.family == 'lighthouse'
        run: docker build -f ../infra/docker/Dockerfile.lighthouse -t dem011-lighthouse:13.0.1 ..
      - name: Préparer les seules fixtures locales
        if: inputs.family != 'mutation'
        run: |
          mkdir -p .tmp/quality
          QUALITY_FIXTURE_PORT=3000 bun --no-env-file scripts/quality/fixture-server.ts --ssr > .tmp/quality/fixture-stack.log 2>&1 &
          echo $! > .tmp/quality/fixture-stack.pid
          for attempt in $(seq 1 40); do
            if curl --fail --silent "$QUALITY_BASE_URL/" > /dev/null; then exit 0; fi
            sleep 1
          done
          cat .tmp/quality/fixture-stack.log
          exit 1
      - if: inputs.family == 'mutation'
        run: bun --no-env-file run verify -- mutation --target "$GD_TARGET"
      - if: inputs.family == 'load'
        run: bun --no-env-file run verify -- load --target "$GD_TARGET"
      - if: inputs.family == 'lighthouse'
        env:
          PROFILE: ${{ inputs.profile }}
        run: bun --no-env-file run verify -- lighthouse --target "$GD_TARGET" --profile "$PROFILE"
      - if: always()
        run: |
          if test -f .tmp/quality/fixture-stack.pid; then
            kill "$(cat .tmp/quality/fixture-stack.pid)" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measures-${{ inputs.target }}-${{ inputs.family }}-${{ inputs.profile }}
          path: webapp/.tmp/quality/
