name: conventions-tests

on:
  pull_request:
  push:
    branches: [develop, master]
permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun install --frozen-lockfile --cwd ../codebase-integrity
      - name: Conventions frontend AST — erreurs et avertissements
        run: bun run --cwd ../codebase-integrity check:frontend:policy
      - run: bun run check:app:types
      - run: bun run check:app:images
      - run: bun run check:app:components:no-business-logic
      - run: bun run check:app:script-setup-standard
      - run: bun run check:app:soc
      - run: bun run check:app:code-quality
      - run: bun run check:app:solid
      - run: bun run check:app:guards
      - run: bun run check:services:no-framework-imports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conventions
          path: webapp/.tmp/quality/
          if-no-files-found: warn
  source-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [showcase-immobilier, client2-immobilier, dashboard]
    env:
      GD_TARGET: ${{ matrix.target }}
      CI: "true"
      NUXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.11.1"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun install --frozen-lockfile --ignore-scripts --cwd ../codebase-integrity
      - run: node node_modules/nuxt/bin/nuxt.mjs prepare --dotenv .env.test
      - run: bun --no-env-file run verify -- functions-debug --target "$GD_TARGET"
      - run: bun --no-env-file run verify -- duplicates --target "$GD_TARGET"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-quality-${{ matrix.target }}
          path: |
            webapp/.tmp/quality/
            webapp/.tmp/playwright/
          if-no-files-found: warn
