name: aide

on:
  workflow_call:

jobs:
  cadre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --cwd codebase-integrity
      - run: bun run --cwd codebase-integrity test:typescript
      - run: bun run --cwd codebase-integrity test:bun
      - name: Vérifier les outils du cadre
        run: make aide-check
