name: aide

on:
  workflow_call:

jobs:
  cadre:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --cwd codebase-integrity
      - name: Tester la fiabilité des vérificateurs
        run: make integrity-test
      - name: Appliquer les conventions documentaires
        run: make conventions-docs-check
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Contrôler la plage PR avec les vérificateurs de la base
        shell: bash
        run: |
          set -euo pipefail
          policy="$RUNNER_TEMP/base-policy"
          mkdir -p "$policy"
          git archive "$BASE_SHA" codebase-integrity | tar -x -C "$policy"
          python3 - "$policy" "$GITHUB_WORKSPACE" "$BASE_SHA" "$HEAD_SHA" <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          policy, repository, base, head = sys.argv[1:]
          source = Path(policy) / 'codebase-integrity/domaines/construction-livraison/scripts/check_commits.py'
          spec = importlib.util.spec_from_file_location('trusted_commits', source)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          errors, count = module.check_range(Path(repository), base, head)
          print(f'Plage PR : {count} commits contrôlés depuis la base.')
          for error in errors:
              print(error, file=sys.stderr)
          sys.exit(bool(errors))
          PY
